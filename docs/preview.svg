<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <rect width="640" height="300" fill="#0f1215"/>

  <!-- transcript -->
  <rect x="32" y="40" width="300" height="220" rx="12" fill="#14171b" stroke="#2a2f35"/>
  <rect x="54" y="66" width="188" height="9" rx="4.5" fill="#ffffff" opacity=".22"/>
  <rect x="54" y="86" width="148" height="9" rx="4.5" fill="#ffffff" opacity=".17"/>
  <rect x="54" y="106" width="172" height="9" rx="4.5" fill="#ffffff" opacity=".2"/>

  <!-- highlighted passage -->
  <rect x="54" y="154" width="238" height="34" rx="6" fill="#d97757" opacity=".28"/>
  <rect x="54" y="154" width="4" height="34" fill="#d97757"/>

  <!-- review bar above the selection -->
  <rect x="46" y="110" width="210" height="36" rx="9" fill="#14171b" stroke="#ffffff" stroke-opacity=".22"/>
  <rect x="56" y="118" width="34" height="20" rx="7" fill="#ffffff" opacity=".08"/>
  <rect x="95" y="118" width="34" height="20" rx="7" fill="#ffffff" opacity=".08"/>
  <rect x="134" y="118" width="34" height="20" rx="7" fill="#ffffff" opacity=".08"/>
  <rect x="174" y="118" width="72" height="20" rx="7" fill="#ffffff" opacity=".05"/>
  <rect x="179" y="125" width="58" height="5" rx="2.5" fill="#ffffff" opacity=".3"/>

  <!-- note chips -->
  <rect x="384" y="52" width="208" height="26" rx="13" fill="#14171b" stroke="#ffffff" stroke-opacity=".18"/>
  <circle cx="396" cy="65" r="4" fill="#d97757"/>
  <rect x="408" y="60" width="148" height="9" rx="4.5" fill="#ffffff" opacity=".4"/>

  <rect x="384" y="90" width="188" height="26" rx="13" fill="#14171b" stroke="#ffffff" stroke-opacity=".18"/>
  <circle cx="396" cy="103" r="4" fill="#d97757"/>
  <rect x="408" y="98" width="130" height="9" rx="4.5" fill="#ffffff" opacity=".4"/>

  <!-- outgoing message -->
  <rect x="384" y="164" width="224" height="104" rx="12" fill="#1c2126" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="400" y="182" width="4" height="24" fill="#d97757"/>
  <rect x="412" y="182" width="164" height="8" rx="4" fill="#ffffff" opacity=".42"/>
  <rect x="412" y="196" width="124" height="8" rx="4" fill="#ffffff" opacity=".32"/>
  <rect x="400" y="224" width="184" height="9" rx="4.5" fill="#ffffff" opacity=".5"/>
  <rect x="400" y="242" width="140" height="9" rx="4.5" fill="#ffffff" opacity=".4"/>
</svg>
